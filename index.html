<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>퍼블리싱 가이드</title>
<link rel="stylesheet" href="https://luvms012-rgb.github.io/ybm-ds/dist/ybm-ds.css">
<style>
  body { margin: 0; min-height: 100vh; background: var(--ybm-color-bg-neutral); color: var(--ybm-color-fg-neutral); }
  main { max-width: 720px; margin: 0 auto; padding: 64px 20px; }
  h1 { margin: 0 0 8px; font-size: var(--ybm-font-size-t09); line-height: var(--ybm-line-height-t09); font-weight: var(--ybm-font-weight-bold); }
  p { margin: 0 0 32px; color: var(--ybm-color-fg-neutral-subtle); }
  .list { display: grid; gap: 12px; }
  .card { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-radius: var(--ybm-shape-xl); background: var(--ybm-color-bg-layer-default); color: inherit; text-decoration: none; box-shadow: inset 0 0 0 1px var(--ybm-color-stroke-neutral-weak); }
  .card:hover { box-shadow: inset 0 0 0 2px var(--ybm-color-stroke-neutral-contrast); }
  .card strong { font-size: var(--ybm-font-size-t06); line-height: var(--ybm-line-height-t06); }
  .card span { color: var(--ybm-color-fg-neutral-subtle); font-size: var(--ybm-font-size-t03); }
</style>
</head>
<body>
  <main>
    <h1>퍼블리싱 가이드</h1>
    <p>마지막 배포 2026-10-28 14:29</p>
    <div class="list">
      <a class="card" href="project/cs/"><strong>고객센터 개편</strong><span>project/cs</span></a>
      <a class="card" href="project/signup/"><strong>회원가입 개편</strong><span>project/signup</span></a>
    </div>
  </main>
</body>
</html>
