<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="회원가입 · 본인인증 | YBM Family">회원가입 · 본인인증 | YBM Family</title>
<!--
  SB.4 ~ SB.12  회원가입 > 본인인증 (이름 → 생년월일 → 성별 → 휴대전화번호/이메일 → 입력 정보 확인 → 약관동의 팝업 → 인증번호 팝업)
  기준: 스토리보드 62슬라이드본(260831) 4~10p
  하나의 화면에서 스텝이 위로 쌓이는 누적(점진적 공개) 방식.
    · 휴대전화 스텝(SB.8)에서 '휴대전화가 없어요' → 이메일 스텝(SB.9), '휴대전화로 인증할게요' → 다시 휴대전화
    · 실명인증 선택 경로는 휴대전화 다음에 입력 정보 확인(SB.10) — 불일치 시 Alert → [확인했어요] 본인확인 약관동의 팝업(SB.11)
    · [인증번호 발송] / SB.11 [동의하고 인증하기] → 인증번호 입력 팝업(SB.12) → 기존 회원 조회(existing-member.html)
    · 만14세 미만(생년월일로 판단, 한국어 전용)은 성별 다음 바로 입력 정보 확인(SB.20) — 인증 패스, 휴대전화·이메일 없음
  진입: 약관동의(terms.html)에서 '실명 인증된 아이디로 가입'을 체크하면 ?real=1
  바로가기(뷰어·QA용): identity.html#sb4 · #sb5 · #sb6 · #sb7 · #sb8 · #sb8-real · #sb9 · #sb10 · #sb10-alert · #sb11 · #sb11-open · #sb12 · #sb12-filled · #sb12-error · #sb20(만14세 미만)
-->
<!-- 한/영: CSS 보다 먼저, defer 없이 (lang 을 렌더 전에 정한다) — ?lang=en 이면 영문 -->
<script src="../i18n/en.js"></script>
<script src="../i18n/i18n.js"></script>
<link rel="stylesheet" href="../ybm-ds/ybm-ds.css">
<link rel="stylesheet" href="../signup-components.css">
<link rel="stylesheet" href="../signup.css">
<script src="../ybm-ds/ybm-ds.js" defer></script>
<script src="../js/verify.js" defer></script>
<script src="../js/identity.js" defer></script>
</head>
<body class="signup">

<main class="signup-screen">

  <!-- Header -->
  <header class="signup-header">
    <a class="signup-header__logo" href="#" aria-label="YBM Family 홈">
      <img src="../assets/ybm-family-logo.svg" alt="YBM Family" width="140" height="36">
    </a>
    <h1 class="signup-header__title" data-i18n="회원가입">회원가입</h1>
    <span class="signup-header__end"></span>
  </header>

  <!-- Card -->
  <section class="signup-card" aria-labelledby="step-title">
    <form id="identity-form" novalidate>
      <div class="signup-content">
        <!-- Screen Title — 스텝마다 문구가 바뀐다 -->
        <h2 class="signup-title" id="step-title" aria-live="polite">이름을 입력해 주세요</h2>

        <!-- 누적 필드: DOM 순서 = 화면 순서. 새 스텝은 위에서 나타나고 이전 스텝은 아래로 밀린다 -->
        <div class="signup-fields">

          <!-- STEP 4-b · 이메일 (SB.9) — 실명인증 미선택 + 휴대전화가 없는 사용자. 휴대전화 스텝과 서로 전환 -->
          <div class="signup-step" data-step="email" hidden>
            <div class="ds-field">
              <label class="ds-field__label" for="email" data-i18n="이메일 주소">이메일 주소</label>
              <div class="ds-input">
                <input class="ds-input__control" id="email" type="email" inputmode="email" autocomplete="email"
                       placeholder="이메일 주소" maxlength="100" aria-describedby="email-help" data-i18n-attr="placeholder:이메일 주소">
                <button type="button" class="ds-input__clear" aria-label="이메일 주소 지우기" data-i18n-attr="aria-label:이메일 주소 지우기"></button>
              </div>
              <!-- 도메인 추천 (DS Chip solid/medium) — 누르면 입력값 뒤에 붙는다 -->
              <div class="ds-chip-group signup-chips" id="email-chips" aria-label="이메일 도메인 추천" data-i18n-attr="aria-label:이메일 도메인 추천">
                <button type="button" class="ds-chip" data-domain="@naver.com">@naver.com</button>
                <button type="button" class="ds-chip" data-domain="@gmail.com">@gmail.com</button>
                <button type="button" class="ds-chip" data-domain="@daum.net">@daum.net</button>
              </div>
              <p class="ds-field__help" id="email-help" hidden></p>
            </div>
          </div>

          <!-- STEP 4 · 휴대전화번호 (SB.8) -->
          <div class="signup-step signup-phone" data-step="phone" hidden>
            <div class="ds-field">
              <label class="ds-field__label" for="phone" data-i18n="휴대전화번호">휴대전화번호</label>
              <div class="ds-input">
                <button type="button" class="ds-input__prefix" id="phone-prefix" aria-haspopup="dialog">
                  <span id="phone-prefix-label">통신사</span><i class="ds-icon ds-icon--chevron-down" aria-hidden="true"></i>
                </button>
                <input class="ds-input__control" id="phone" type="tel" inputmode="numeric" autocomplete="tel-national"
                       value="010" placeholder=" " maxlength="15" aria-describedby="phone-help">
                <button type="button" class="ds-input__clear" aria-label="휴대전화번호 지우기" data-i18n-attr="aria-label:휴대전화번호 지우기"></button>
              </div>
              <p class="ds-field__help" id="phone-help" hidden></p>
            </div>
          </div>

          <!-- STEP 3 · 성별 (SB.6~7) — 입력 대신 레이어팝업에서 선택 (Field Button 동작) -->
          <div class="signup-step" data-step="gender" hidden>
            <div class="ds-field">
              <label class="ds-field__label" for="gender" data-i18n="성별">성별</label>
              <div class="ds-input">
                <button type="button" class="ds-input__control" id="gender" data-placeholder="성별" data-i18n-attr="data-placeholder:성별"
                        aria-haspopup="dialog" data-ds-open="dialog-gender"></button>
              </div>
            </div>
          </div>

          <!-- STEP 2 · 생년월일 (SB.5) -->
          <div class="signup-step" data-step="birth" hidden>
            <div class="ds-field">
              <label class="ds-field__label" for="birth" data-i18n="생년월일">생년월일</label>
              <div class="ds-input">
                <input class="ds-input__control" id="birth" type="text" inputmode="numeric" autocomplete="bday"
                       placeholder="0000.00.00" maxlength="10" aria-describedby="birth-help">
                <button type="button" class="ds-input__clear" aria-label="생년월일 지우기" data-i18n-attr="aria-label:생년월일 지우기"></button>
              </div>
              <p class="ds-field__help" id="birth-help" data-i18n="생년월일은 8자리 숫자로 입력해 주세요.">생년월일은 8자리 숫자로 입력해 주세요.</p>
            </div>
          </div>

          <!-- STEP 1 · 이름 (SB.4) -->
          <div class="signup-step" data-step="name" data-state="active">
            <div class="ds-field">
              <label class="ds-field__label" for="name" data-i18n="이름">이름</label>
              <div class="ds-input">
                <input class="ds-input__control" id="name" type="text" autocomplete="name"
                       placeholder="이름" maxlength="50" aria-describedby="name-help" data-i18n-attr="placeholder:이름">
                <button type="button" class="ds-input__clear" aria-label="이름 지우기" data-i18n-attr="aria-label:이름 지우기"></button>
              </div>
              <p class="ds-field__help" id="name-help">한글, 영문 대/소문자를 사용해 주세요. (특수기호, 공백 사용 불가)</p>
            </div>
            <!-- 약관동의에서 '실명 인증된 아이디로 가입'을 고른 값이 넘어온다(?real=1). 이 단계에서만 변경 가능
                 영문(외국인 가입)은 실명인증이 없어 숨긴다 — data-ko-only -->
            <label class="ds-checkbox signup-step__extra" data-ko-only>
              <input type="checkbox" class="ds-checkbox__control" id="real-name">
              <span>실명 인증된 아이디로 가입</span>
            </label>
          </div>

        </div>
      </div>

      <!-- CTA Area -->
      <div class="signup-cta">
        <button type="button" class="ds-link" id="switch-contact" hidden>휴대전화가 없어요</button>
        <button type="submit" class="ds-btn" id="cta" data-variant="brandSolid" data-size="large" data-width="fill" disabled>다음</button>
      </div>
    </form>
  </section>
</main>


<!-- ================= 레이어팝업 (DS Dialog · 폭 360) ================= -->

<!-- 성별 선택 (SB.6) — 실명인증 미선택 시 '선택안함'(영문 Other) 추가 -->
<dialog class="ds-dialog signup-dialog" id="dialog-gender" aria-labelledby="dialog-gender-title">
  <div class="ds-dialog__header">
    <h2 class="ds-dialog__title" id="dialog-gender-title" data-i18n="성별을 선택해 주세요">성별을 선택해 주세요</h2>
    <button type="button" class="ds-dialog__close" data-ds-close aria-label="닫기" data-i18n-attr="aria-label:닫기"></button>
  </div>
  <div class="ds-dialog__body">
    <ul class="ds-select-list" role="listbox" aria-labelledby="dialog-gender-title" data-target="gender">
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="남성" data-i18n="남성">남성</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="여성" data-i18n="여성">여성</button></li>
      <li data-only="not-real"><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="선택안함" data-i18n="선택안함">선택안함</button></li>
    </ul>
  </div>
</dialog>

<!-- 통신사 선택 (SB.8 · 실명인증 선택 시) -->
<dialog class="ds-dialog signup-dialog" id="dialog-carrier" aria-labelledby="dialog-carrier-title">
  <div class="ds-dialog__header">
    <h2 class="ds-dialog__title" id="dialog-carrier-title" data-i18n="통신사를 선택해 주세요">통신사를 선택해 주세요</h2>
    <button type="button" class="ds-dialog__close" data-ds-close aria-label="닫기" data-i18n-attr="aria-label:닫기"></button>
  </div>
  <div class="ds-dialog__body">
    <ul class="ds-select-list" role="listbox" aria-labelledby="dialog-carrier-title" data-target="carrier">
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="SKT">SKT</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="KT">KT</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="LG U+">LG U+</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="SKT 알뜰폰" data-i18n="SKT 알뜰폰">SKT 알뜰폰</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="KT 알뜰폰" data-i18n="KT 알뜰폰">KT 알뜰폰</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="LG U+ 알뜰폰" data-i18n="LG U+ 알뜰폰">LG U+ 알뜰폰</button></li>
    </ul>
  </div>
</dialog>

<!-- 국가번호 선택 (SB.8 · 실명인증 미선택 시, 기본 한국어 +82 / 영문 +1 미국) — 영문은 국가명 알파벳순으로 정렬 -->
<dialog class="ds-dialog signup-dialog" id="dialog-country" aria-labelledby="dialog-country-title">
  <div class="ds-dialog__header">
    <h2 class="ds-dialog__title" id="dialog-country-title" data-i18n="국가번호를 선택해 주세요">국가번호를 선택해 주세요</h2>
    <button type="button" class="ds-dialog__close" data-ds-close aria-label="닫기" data-i18n-attr="aria-label:닫기"></button>
  </div>
  <div class="ds-dialog__body">
    <ul class="ds-select-list" role="listbox" aria-labelledby="dialog-country-title" data-target="country">
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+233" data-country="GH" data-i18n="가나 +233">가나 +233</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+30" data-country="GR" data-i18n="그리스 +30">그리스 +30</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+31" data-country="NL" data-i18n="네덜란드 +31">네덜란드 +31</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+977" data-country="NP" data-i18n="네팔 +977">네팔 +977</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+47" data-country="NO" data-i18n="노르웨이 +47">노르웨이 +47</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+64" data-country="NZ" data-i18n="뉴질랜드 +64">뉴질랜드 +64</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+227" data-country="NE" data-i18n="니제르 +227">니제르 +227</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+505" data-country="NI" data-i18n="니카라과 +505">니카라과 +505</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="true" data-value="+82" data-country="KR" data-i18n="대한민국 +82">대한민국 +82</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+45" data-country="DK" data-i18n="덴마크 +45">덴마크 +45</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+1" data-country="DO" data-i18n="도미니카공화국 +1">도미니카공화국 +1</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+49" data-country="DE" data-i18n="독일 +49">독일 +49</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+856" data-country="LA" data-i18n="라오스 +856">라오스 +856</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+7" data-country="RU" data-i18n="러시아 +7">러시아 +7</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+60" data-country="MY" data-i18n="말레이시아 +60">말레이시아 +60</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+52" data-country="MX" data-i18n="멕시코 +52">멕시코 +52</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+976" data-country="MN" data-i18n="몽골 +976">몽골 +976</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+1" data-country="US" data-i18n="미국 +1">미국 +1</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+84" data-country="VN" data-i18n="베트남 +84">베트남 +84</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+971" data-country="AE" data-i18n="아랍에미리트 +971">아랍에미리트 +971</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+44" data-country="GB" data-i18n="영국 +44">영국 +44</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+598" data-country="UY" data-i18n="우루과이 +598">우루과이 +598</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+998" data-country="UZ" data-i18n="우즈베키스탄 +998">우즈베키스탄 +998</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+380" data-country="UA" data-i18n="우크라이나 +380">우크라이나 +380</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+81" data-country="JP" data-i18n="일본 +81">일본 +81</button></li>
      <li><button type="button" class="ds-select-item" role="option" aria-selected="false" data-value="+86" data-country="CN" data-i18n="중국 +86">중국 +86</button></li>
    </ul>
  </div>
</dialog>

<!-- 정보 불일치 Alert (SB.10 · DS Dialog closeButton=false · footer=true) — 버튼으로만 닫힌다 -->
<dialog class="ds-dialog signup-alert" id="dialog-mismatch" role="alertdialog" aria-labelledby="dialog-mismatch-title" aria-describedby="dialog-mismatch-desc">
  <div class="ds-dialog__header">
    <h2 class="ds-dialog__title" id="dialog-mismatch-title" data-i18n="입력하신 정보와 실명인증 정보가 일치하지 않습니다">입력하신 정보와 실명인증 정보가<br>일치하지 않습니다</h2>
    <p class="ds-dialog__desc" id="dialog-mismatch-desc" data-i18n="다시 확인 후 인증을 시도해 주세요.">다시 확인 후 인증을 시도해 주세요.</p>
  </div>
  <div class="ds-dialog__footer">
    <button type="button" class="ds-btn" data-variant="neutralWeak" data-ds-close data-i18n="확인">확인</button>
  </div>
</dialog>

<!-- 본인확인 약관동의 (SB.11 · 실명인증 선택 경로) — DS Dialog closeButton=true · footer=true · 폭 360 -->
<dialog class="ds-dialog signup-modal" id="dialog-auth-terms" aria-labelledby="dialog-auth-terms-title">
  <div class="ds-dialog__header">
    <h2 class="ds-dialog__title" id="dialog-auth-terms-title" data-i18n="본인확인을 위한 약관동의가 필요합니다">본인확인을 위한 약관동의가<br>필요합니다</h2>
    <button type="button" class="ds-dialog__close" data-ds-close aria-label="닫기" data-i18n-attr="aria-label:닫기"></button>
  </div>
  <div class="ds-dialog__body">
    <div class="signup-auth-terms">
      <div class="signup-auth-terms__all">
        <label class="ds-checkbox" data-size="large">
          <input type="checkbox" class="ds-checkbox__control" id="auth-all">
          <span data-i18n="필수 약관 전체 동의">필수 약관 전체 동의</span>
        </label>
        <!-- 약관 목록 펼침/접힘 (기획서 2·3번) -->
        <button type="button" class="signup-auth-terms__toggle" id="auth-toggle" aria-expanded="false" aria-controls="auth-terms-list"
                aria-label="약관 펼치기" data-i18n-attr="aria-label:약관 펼치기">
          <i class="ds-icon ds-icon--chevron-down ds-icon--lg" aria-hidden="true"></i>
        </button>
      </div>
      <ul class="signup-terms signup-auth-terms__list" id="auth-terms-list" hidden>
          <li class="signup-terms__item">
            <label class="ds-checkbox" data-variant="ghost">
              <input type="checkbox" class="ds-checkbox__control" name="auth-terms">
              <span><em class="signup-terms__tag" data-i18n="필수">필수</em> <span data-i18n="개인정보 수집 및 이용 안내">개인정보 수집 및 이용 안내</span></span>
            </label>
            <button type="button" class="signup-terms__view" data-term="개인정보 수집 및 이용 안내" data-i18n="보기">보기</button>
          </li>
          <li class="signup-terms__item">
            <label class="ds-checkbox" data-variant="ghost">
              <input type="checkbox" class="ds-checkbox__control" name="auth-terms">
              <span><em class="signup-terms__tag" data-i18n="필수">필수</em> <span data-i18n="인증시 고유식별정보처리">인증시 고유식별정보처리</span></span>
            </label>
            <button type="button" class="signup-terms__view" data-term="인증시 고유식별정보처리" data-i18n="보기">보기</button>
          </li>
          <li class="signup-terms__item">
            <label class="ds-checkbox" data-variant="ghost">
              <input type="checkbox" class="ds-checkbox__control" name="auth-terms">
              <span><em class="signup-terms__tag" data-i18n="필수">필수</em> <span data-i18n="통신사 이용약관">통신사 이용약관</span></span>
            </label>
            <button type="button" class="signup-terms__view" data-term="통신사 이용약관" data-i18n="보기">보기</button>
          </li>
          <li class="signup-terms__item">
            <label class="ds-checkbox" data-variant="ghost">
              <input type="checkbox" class="ds-checkbox__control" name="auth-terms">
              <span><em class="signup-terms__tag" data-i18n="필수">필수</em> <span data-i18n="인증사 이용약관">인증사 이용약관</span></span>
            </label>
            <button type="button" class="signup-terms__view" data-term="인증사 이용약관" data-i18n="보기">보기</button>
          </li>
          <li class="signup-terms__item">
            <label class="ds-checkbox" data-variant="ghost">
              <input type="checkbox" class="ds-checkbox__control" name="auth-terms">
              <span><em class="signup-terms__tag" data-i18n="필수">필수</em> <span data-i18n="YBM 개인정보 수집">YBM 개인정보 수집</span></span>
            </label>
            <button type="button" class="signup-terms__view" data-term="YBM 개인정보 수집" data-i18n="보기">보기</button>
          </li>
      </ul>
    </div>
  </div>
  <div class="ds-dialog__footer">
    <button type="button" class="ds-btn" id="auth-terms-submit" data-variant="brandSolid" disabled data-i18n="동의하고 인증하기">동의하고 인증하기</button>
  </div>
</dialog>

<!-- 인증번호 입력 (SB.12 · 휴대전화/이메일 공통) — DS Dialog 폭 400 + 회원가입 인증번호 입력(signup-components.css) -->
<dialog class="ds-dialog signup-modal signup-modal--otp" id="dialog-otp" aria-labelledby="dialog-otp-title">
  <div class="ds-dialog__header">
    <h2 class="ds-dialog__title" id="dialog-otp-title">010-1234-5678로 전송된<br>인증번호를 입력해 주세요</h2>
    <button type="button" class="ds-dialog__close" data-ds-close aria-label="닫기" data-i18n-attr="aria-label:닫기"></button>
  </div>
  <div class="ds-dialog__body">
    <div class="signup-otp">
      <div class="signup-code-input" id="otp-code">
        <input class="signup-code-input__control" id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
               aria-label="인증번호 6자리" aria-describedby="otp-error" data-i18n-attr="aria-label:인증번호 6자리">
        <span class="signup-code-input__cell"></span><span class="signup-code-input__cell"></span><span class="signup-code-input__cell"></span>
        <span class="signup-code-input__cell"></span><span class="signup-code-input__cell"></span><span class="signup-code-input__cell"></span>
      </div>
      <p class="signup-otp__error" id="otp-error" hidden data-i18n="인증번호를 다시 입력해 주세요.">인증번호를 다시 입력해 주세요.</p>
      <div class="signup-otp__meta">
        <span class="signup-otp__timer">
          <span id="otp-remaining" role="timer">남은 시간 05:00</span>
          <span class="signup-otp__divider" aria-hidden="true">|</span>
          <button type="button" class="signup-otp__extend" id="otp-extend" data-i18n="시간연장">시간연장</button>
        </span>
        <button type="button" class="signup-otp__resend" id="otp-resend" data-i18n="재전송">재전송</button>
      </div>
    </div>
  </div>
  <div class="ds-dialog__footer">
    <button type="button" class="ds-btn" id="otp-submit" data-variant="brandSolid" disabled data-i18n="인증번호 확인">인증번호 확인</button>
  </div>
</dialog>

</body>
</html>
